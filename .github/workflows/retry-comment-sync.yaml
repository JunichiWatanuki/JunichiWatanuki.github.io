name: Retry failed comment synchronization

on:
  workflow_run:
    workflows: ["Build and deploy GitHub Pages"]
    types: [completed]
    branches: [main, master]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.event == 'issues' || github.event.workflow_run.event == 'issue_comment') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed synchronization with its original event
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ORIGINAL_RUN_ID" in
            ''|*[!0-9]*) echo 'Invalid workflow run ID' >&2; exit 1 ;;
          esac
          sleep 10
          gh run rerun "$ORIGINAL_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

